# Kainotomic standard check `key-check`, public-repo form (KOPS-358 plan section 6c).
# A public repo cannot resolve actions from the private Kainotomic/.github repo, and the Jira organisation
# secrets do not reach public repos, so this file inlines actions/jira-key-check/check.sh from
# Kainotomic/.github@2e8df8760f9e94576cdf8da6e55a3dcfe4014ea8 (sha256 30a16e7a460c417f...) and has no issue intake.
# Keep the script byte-identical to that file; change it there first, then copy it here.
name: jira
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  key-check:
    runs-on: [ubuntu-slim]
    steps:
      - name: Check for a Jira key
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PROJECTS: KOPS
          MODE: required
        run: |
          #!/usr/bin/env bash
          # Exit 0 when the PR may merge; exit 1 when MODE=required and neither the PR title nor the branch
          # carries a key of an allowed Jira project. Bots and PRs labeled no-jira are exempt.
          set -euo pipefail

          summary() {
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then printf '%s\n' "$@" >>"$GITHUB_STEP_SUMMARY"; fi
          }

          case "${MODE:-warn}" in warn | required) ;; *) echo "::error::mode must be warn or required, got '${MODE}'"; exit 1 ;; esac

          if [ "${AUTHOR_TYPE:-}" = "Bot" ]; then echo "Bot PR by ${AUTHOR:-unknown}: exempt."; exit 0; fi
          case "${AUTHOR:-}" in *'[bot]') echo "Bot PR by $AUTHOR: exempt."; exit 0 ;; esac
          # LABELS is the JSON array of label names, so "no-jira" with its quotes matches only that exact label.
          case "${LABELS:-}" in *'"no-jira"'*) echo "Labeled no-jira: exempt."; exit 0 ;; esac

          keys=$(printf '%s' "${PROJECTS:-}" | tr -s ' ' '\n' | { grep -E '^[A-Z][A-Z0-9]+$' || true; } | paste -sd '|' -)
          if [ -z "$keys" ]; then echo "::error::jira-project input is empty or invalid"; exit 1; fi

          if printf '%s\n%s\n' "${TITLE:-}" "${BRANCH:-}" | grep -Eq "(^|[^A-Za-z0-9])($keys)-[0-9]+([^A-Za-z0-9]|\$)"; then
            echo "Jira key found."
            exit 0
          fi

          primary=${keys%%|*}
          msg="No Jira key (${keys//|/, }) in the PR title or branch. Title it like [$primary-123] subject, or add the no-jira label."
          summary "### Jira key missing" "$msg"
          if [ "${MODE:-warn}" = "required" ]; then
            echo "::error::$msg"
            exit 1
          fi
          echo "::warning::$msg"
