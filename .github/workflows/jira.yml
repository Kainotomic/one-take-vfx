# Generated by Kainotomic/.github scripts/jira-adopt-repo.sh; rerun it instead of editing by hand.
# Actions pinned to Kainotomic/.github@2e8df8760f9e94576cdf8da6e55a3dcfe4014ea8; rerunning the script advances the pin.
name: jira
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  issues:
    types: [opened]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  key-check:
    if: github.event_name == 'pull_request'
    runs-on: [ubuntu-slim]
    steps:
      - uses: Kainotomic/.github/actions/jira-key-check@2e8df8760f9e94576cdf8da6e55a3dcfe4014ea8
        with:
          jira-project: KOPS
          mode: required
  intake:
    if: github.event_name != 'pull_request'
    runs-on: [ubuntu-slim]
    # One group per issue: GitHub keeps only one pending run per group, so a shared group drops issues.
    concurrency:
      group: jira-intake-${{ github.event.issue.number || 'sweep' }}
      cancel-in-progress: false
    steps:
      - uses: Kainotomic/.github/actions/jira-intake@2e8df8760f9e94576cdf8da6e55a3dcfe4014ea8
        with:
          jira-project: KOPS
          jira-epic: ""
          jira-api-base: ${{ secrets.JIRA_API_BASE }}
          jira-email: ${{ secrets.JIRA_EMAIL }}
          jira-api-token: ${{ secrets.JIRA_API_TOKEN }}
